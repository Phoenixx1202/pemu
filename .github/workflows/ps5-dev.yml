name: ps5-dev

on:
  #push:
  #  branches: [ dev ]
  workflow_dispatch:

jobs:

  build-ps5-dev:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install bash clang-18 lld-18
          sudo apt install build-essential cmake zip

      - name: Install toolchain
        run: |
          wget https://github.com/ps5-payload-dev/pacbrew-repo/releases/latest/download/ps5-payload-dev.tar.gz
          sudo tar xf ps5-payload-dev.tar.gz -C /

      - name: Configure
        run: |
          /opt/ps5-payload-sdk/bin/prospero-cmake -DCMAKE_BUILD_TYPE=Debug -DPLATFORM_PS5=YES -DOPTION_MPV_PLAYER=NO -S . -B build

      - name: Build pnes
        run: |
          make -C build pnes_ps5_release

      - name: Build pgba
        run: |
          make -C build pgba_ps5_release

      - name: Build pfbneo
        run: |
          make -C build pfbneo.deps
          make -C build pfbneo_ps5_release